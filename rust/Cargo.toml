[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
spectre-core = { path = "crates/spectre-core" }
spectre-providers = { path = "crates/spectre-providers" }
spectre-correlation = { path = "crates/spectre-correlation" }
spectre-breach = { path = "crates/spectre-breach" }
spectre-audit = { path = "crates/spectre-audit" }
spectre-storage = { path = "crates/spectre-storage" }
spectre-discovery = { path = "crates/spectre-discovery" }

tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "http2", "json", "gzip", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
futures = "0.3"
url = "2.5"
regex = "1.11"
scraper = "0.29"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
uuid = { version = "1.18", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde", "std"] }
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"
rand = "0.10"
phonenumber = "0.3.10"
async-trait = "0.1.89"
wiremock = "0.6.5"
tempfile = "3.20"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
